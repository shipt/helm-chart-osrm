# Default values for osrm.

# Weighted rule based on which OSRM computes
weightedRule: "" 

# Chart name override. Defaults to chart name, i.e. "osrm".
nameOverride: ""
# App name override. Defaults to name built upon release name and chart name.
fullnameOverride: ""

# App namespace override. Defaults to chart name.
namespace: ""

# How many replicas of the statefulset to deploy.
replicaCount: 1

cluster:
  domain: ""
  tlsCertSecret: ""

image:
  repository: osrm/osrm-backend
  tag: v5.22.0
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Init containers to add to the pod in statefulset.
# This field is plain yaml that is inserted as-is.
initContainers: []

# Init containers to add to the pod in statefulset.
# This field is a template string that is passed to tpl func before insertion.
initContainersTpl: ""

# Extra arguments to pass to the osrm binary.
extraArgs: [
  "--max-table-size",
  "5000"
]

# Extra volumes to add to the pod.
# This field is plain yaml that is inserted as-is.
extraVolumes: []
#  # Example:
#  - name: something
#    configMap:
#      name: some-volume

# Extra volumes to add to the pod.
# This field is a template string that is passed to tpl func before insertion.
extraVolumesTpl: ""
#  # Example:
#  - name: scripts
#    configMap:
#      name: {{ include "osrm.fullname" . }}-scripts

# Files that are stored in configmap and can be accessed from containers/initContainers.
# This field is a map, where keys are configmap key names and values are file paths relative to chart root.
# File contents is passed to tpl func before insertion.
configTemplatedFiles: {}
#  # Example:
#  download.sh: "files/download.sh.tpl"
#  extract.sh: "files/extract.sh.tpl"

# Kubernetes Service object configuration.
service:
  type: ClusterIP
  port: 8080

# Kubernetes Ingress object configuration.
ingress:
  enabled: false
  extraLabels: {}
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# ProjectContour HTTPProxy configuration
httpproxy:
  enabled: true
  max_connections: "5000"
  max_requests: "5000"

resources: {}
  # requests:
  #   cpu: 200m
  #   memory: 256Mi
  # limits:
  #   cpu: 1000m
  #   memory: 512Mi

nodeSelector:
  node_pool: osrm-01

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "osrm"
    effect: "NoSchedule"

affinity: {
}


# GCP service account email for use with workload identity
serviceAccountEmail: ""

livenessProbe: null
#  httpGet:
#    path: /table/v1/car/13.388860,52.517037;13.385983,52.496891
#    port: http

readinessProbe:
 httpGet:
   path: /table/v1/car/13.388860,52.517037;13.385983,52.496891
   port: http
 initialDelaySeconds: 300

# Persistence allows you to store downloaded maps in the persistent store.
# Enable & configure this if you don't want to download the same maps each
# time you deploy.
persistence:
  enabled: true

  # If defined, storageClassName: <storageClass>.
  # If set to "-", storageClassName: "", which disables dynamic provisioning.
  # If set to null (the default), no storageClassName spec is set, choosing
  # 'standard' storage class available with the default provisioner
  # (gcd-pd on GKE, hostpath on minikube, etc).
  # More info: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#class-1
  storageClassName: null

  accessModes:
    - ReadWriteOnce
  size: 300Gi

# map configuration enables out-of-the-box map downloading from various sources and required preparations
# (extraction, etc.).
#
# If you do not want to use default downloading mechanics of this chart, you can disable this.
map:
  # Whether the map downloading feature is enabled.
  # If you want to manage maps yourself (e.g. mount pre-existing PV with maps to the pod),
  # set this to false.
  enabled: true

  # Configures what source provider to use to download map.
  # Supported providers:
  # - http
  # - gcs
  source: gcs

  # http section is used when chart is configured to download maps from an HTTP endpoint.
  #
  # HTTP mode is designed to download .pbf file from the source, extract it and run other preparation commands.
  # Each replica in the stateful set executes these actions on its own volume and map.
  #
  # HTTP mode supports versioning. It downloads/extracts the map once for each version and creates corresponding
  # lock-files "downloaded.lock", "extracted.lock". You can remove file to re-do an action, e.g. remove
  # "downloaded.txt" to re-download the map.
  # There is no logic to distinguish versions, so no version can be considered "old". If you want to remove old
  # versions from the volume, you have to do it manually.
  http:
    # An arbitrary version for the map at the uri. Any versioning scheme can be used. This field is used only to create
    # corresponding directory within the volume and to decide whether to download a new version of the map.
    #
    # Example: "20200226-1"
    version: ""

    # HTTP(S) uri to download map.
    #
    # Some sources/mirrors you may use:
    # - http://download.geofabrik.de
    # - https://download.openstreetmap.fr/extracts/
    uri: https://download.geofabrik.de/north-america-latest.osm.pbf
    #uri: https://download.openstreetmap.fr/extracts/europe/monaco.osm.pbf

    force: true

    # Set to "true" when the .md5 file is available for checksum.
    checkMD5: false

    # http mode files for config map.
    # See top-level 'configTemplatedFiles' for documentation.
    configTemplatedFiles:
      download.sh: "files/http-download.sh.tpl"
      extract.sh: "files/http-extract.sh.tpl"
      gcs-upload-prepared.sh: "files/gcs-upload-prepared.sh.tpl"

    # To upload to a private gcs bucket you need google application credentials.
    # This section allows configuring it via an externally created secret.
    googleApplicationCredentials:
      enabled: true
      secretName: osrm-google-application-credentials
      secretKey: credentials.json

    # http mode init containers.
    # See tol-level 'initContainersTpl' for documentation.
    initContainersTpl: |-
      - name: map-downloader
        image: bash:5
        imagePullPolicy: IfNotPresent
        command:
          - /scripts/download.sh
        volumeMounts:
          - name: config-files
            mountPath: /scripts
          - name: maps
            mountPath: /data/maps
      - name: map-extractor
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /scripts/extract.sh
          - {{ .Values.weightedRule }}
        volumeMounts:
          - name: config-files
            mountPath: /scripts
          - name: maps
            mountPath: /data/maps
      - name: map-uploader
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:582.0.0-alpine
        imagePullPolicy: IfNotPresent
        command:
          - /scripts/gcs-upload-prepared.sh
        volumeMounts:
          - name: config-files
            mountPath: /scripts
          - name: maps
            mountPath: /data/maps

  # gcs section is used when chart is configured to download maps from Google Cloud Storage bucket.
  #
  # gcs mode is designed to do download already prepared map files in the form of tgz archive.
  # Each replica in the stateful set downloads its own copy of map.
  #
  # gcs mode supports versioning. It downloads the map once for each version, and creates "ready.lock" file.
  # If you want to re-download the map of already downloaded version on the next pod start, remove this file.
  # There is no logic to distinguish versions, so no version can be considered "old". If you want to remove old
  # versions from the volume, you have to do it manually.
  gcs:
    # An arbitrary version for the map at the uri. Any versioning scheme can be used. This field is used only to create
    # corresponding directory within the volume and to decide whether to download a new version of the map.
    #
    # Example: "20200226-1"
    version: ""

    # Google Cloud Storage URI to download map archive from.
    #
    # Example: "gs://example-osrm-maps/20200226-1/map.tar.gz"
    uri: ""

    # To download from private gcs bucket you need google application credentials.
    # This section allows configuring it via an externally created secret.
    googleApplicationCredentials:
      enabled: true
      secretName: osrm-google-application-credentials
      secretKey: credentials.json

    # gcs mode files for config map.
    # See top-level 'configTemplatedFiles' for documentation.
    configTemplatedFiles:
      download.sh: "files/gcs-download-prepared.sh.tpl"

    # gcs mode init containers.
    # See tol-level 'initContainersTpl' for documentation.
    initContainersTpl: |-
      - name: map-downloader
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:582.0.0-alpine
        imagePullPolicy: IfNotPresent
        command:
          - /scripts/download.sh
        {{- if .Values.map.gcs.googleApplicationCredentials.enabled }}
        env:
          - name: GOOGLE_APPLICATION_CREDENTIALS
            value: /var/run/secrets/osrm/google-application-credentials/{{ .Values.map.gcs.googleApplicationCredentials.secretKey }}
        {{- end }}
        volumeMounts:
          - name: config-files
            mountPath: /scripts
          - name: maps
            mountPath: /data/maps
          {{- if .Values.map.gcs.googleApplicationCredentials.enabled }}
          - name: google-application-credentials
            mountPath: /var/run/secrets/osrm/google-application-credentials
            readOnly: true
          {{- end }}

    # gcs mode extra volumes.
    # See tol-level 'extraVolumesTpl' for documentation.
    extraVolumesTpl: |-
      - name: google-application-credentials
        secret:
          secretName: {{ .Values.map.gcs.googleApplicationCredentials.secretName }}


routed:
  # CH or MLD
  algorithm: CH

# Datadog alerting via the Datadog Operator's DatadogMonitor CRD
# (apiVersion: datadoghq.com/v1alpha1, kind: DatadogMonitor).
#
# Requires the Datadog Operator to be installed in the cluster so the
# DatadogMonitor CRD exists. Each entry in 'monitors' becomes one monitor.
#
# NOTE: OSRM (osrm-routed) never returns 503 itself - it only returns 200/400.
# In this chart traffic is fronted by Contour/Envoy (see httpproxy.yaml), so
# 503s are emitted by Envoy when there is no healthy upstream, when retries are
# exhausted, or when the max-connections/max-requests limits are hit. The
# default monitor below therefore alerts on Envoy upstream 503s for this
# service. Adjust the query to match how your Envoy/Contour metrics are tagged
# in Datadog (the Datadog Envoy integration must be scraping Contour's Envoy).
datadogMonitors:
  enabled: false

  # Tags applied to every monitor.
  tags:
    - "service:osrm"
    # - "env:prod"

  # Notification handles appended to every monitor message (e.g. Slack/PagerDuty).
  # Example: "@slack-osrm-alerts @pagerduty-osrm"
  notify: ""

  # 'query' and 'message' are rendered through Helm's tpl function, so you can
  # reference values like {{ include "osrm.fullname" . }} and
  # {{ include "osrm.namespace" . }}.
  monitors:
    - # Kubernetes-safe name for the DatadogMonitor object (defaults to a slug of 'name').
      objectName: "osrm-upstream-503"
      # Human-readable monitor name shown in Datadog.
      name: "OSRM upstream 503s"
      type: "query alert"
      query: >-
        sum(last_5m):sum:envoy.cluster.upstream_rq{response_code:503,kube_namespace:{{ include "osrm.namespace" . }}}.as_count() > 5
      message: |-
        OSRM ({{ include "osrm.fullname" . }} in {{ include "osrm.namespace" . }}) is
        returning 503s from Envoy. Likely causes: no healthy upstream (pods not Ready
        / map still downloading), retry exhaustion, or the max-connections/max-requests
        limits being hit.
      priority: 2
      thresholds:
        critical: 5
        warning: 1
      # Extra fields merged into spec.options (evaluationDelay, notifyNoData, etc.).
      options:
        notifyNoData: false
        evaluationDelay: 60

    - # Catches a full outage at the source (no Ready pods behind the Service),
      # which is what actually produces Envoy "no healthy upstream" 503s.
      objectName: "osrm-all-replicas-down"
      name: "OSRM all replicas down"
      type: "query alert"
      query: >-
        min(last_5m):sum:kubernetes_state.statefulset.replicas_ready{kube_statefulset:{{ include "osrm.fullname" . }},kube_namespace:{{ include "osrm.namespace" . }}} <= 0
      message: |-
        No Ready OSRM pods for {{ include "osrm.fullname" . }} in {{ include "osrm.namespace" . }}.
        The Service has no healthy upstream, so Envoy will return 503s. Check pod
        status (ImagePullBackOff / CrashLoopBackOff), recent node recycles, and events.
      priority: 1
      thresholds:
        critical: 0
      options:
        notifyNoData: true
        noDataTimeframe: 10
        evaluationDelay: 60

    - # Root cause of the 2026-09-08 incident: a pinned init-container image
      # (e.g. gcr.io/google.com/cloudsdktool/cloud-sdk:<tag>) became unpullable
      # after a node recycle, leaving pods in ImagePullBackOff. Catches it before
      # it turns into a full 503 outage.
      objectName: "osrm-image-pull-failure"
      name: "OSRM image pull failure"
      type: "query alert"
      query: >-
        min(last_10m):sum:kubernetes_state.container.status_report.count.waiting{reason:imagepullbackoff,kube_namespace:{{ include "osrm.namespace" . }}} by {kube_container_name} >= 1
      message: |-
        A container in {{ include "osrm.namespace" . }} is stuck in ImagePullBackOff.
        A pinned image tag (init containers use cloud-sdk / osrm-backend) is likely
        missing or unpullable - common after a node recycle reschedules pods. Verify
        the image tags in values.yaml still exist in the registry.
      priority: 2
      thresholds:
        critical: 1
      options:
        notifyNoData: false
        evaluationDelay: 60

    - # Pods repeatedly crashing (e.g. bad map, OOM, missing image on restart).
      objectName: "osrm-crashloop"
      name: "OSRM pods crash looping"
      type: "query alert"
      query: >-
        min(last_10m):sum:kubernetes_state.container.status_report.count.waiting{reason:crashloopbackoff,kube_namespace:{{ include "osrm.namespace" . }}} by {kube_container_name} >= 1
      message: |-
        A container in {{ include "osrm.namespace" . }} is in CrashLoopBackOff.
        Check container logs and recent changes (image tag, map version, resources).
      priority: 2
      thresholds:
        critical: 1
      options:
        notifyNoData: false
        evaluationDelay: 60

    - # Init-container image pull failures specifically. The map-downloader/
      # map-extractor/map-uploader init containers pin external images
      # (cloud-sdk, osrm-backend); if any becomes unpullable the pod never
      # starts osrm-routed. Scoped to the init containers so it fires precisely.
      objectName: "osrm-init-image-pull-failure"
      name: "OSRM init-container image pull failure"
      type: "query alert"
      query: >-
        min(last_10m):sum:kubernetes_state.container.status_report.count.waiting{reason:imagepullbackoff,kube_namespace:{{ include "osrm.namespace" . }},kube_container_name IN (map-downloader,map-extractor,map-uploader)} by {kube_container_name} >= 1
      message: |-
        An OSRM init container (map-downloader/map-extractor/map-uploader) in
        {{ include "osrm.namespace" . }} is stuck in ImagePullBackOff. A pinned
        init-container image tag is missing/unpullable - verify the cloud-sdk and
        osrm-backend image tags in values.yaml still exist in the registry
        (commonly surfaces after a node recycle reschedules pods).
      priority: 2
      thresholds:
        critical: 1
      options:
        notifyNoData: false
        evaluationDelay: 60

    - # Map volumes are large (default 300Gi) and persistent; a full PVC blocks
      # map downloads/extraction and can wedge pods. Alert before it fills.
      objectName: "osrm-pvc-near-full"
      name: "OSRM map volume near full"
      type: "query alert"
      query: >-
        min(last_15m):( sum:kubernetes.kubelet.volume.stats.used_bytes{kube_namespace:{{ include "osrm.namespace" . }},persistentvolumeclaim:maps-*} by {persistentvolumeclaim} / sum:kubernetes.kubelet.volume.stats.capacity_bytes{kube_namespace:{{ include "osrm.namespace" . }},persistentvolumeclaim:maps-*} by {persistentvolumeclaim} ) * 100 > 90
      message: |-
        An OSRM map PVC (maps-*) in {{ include "osrm.namespace" . }} is over 90% full.
        Map downloads/extraction may fail. Free space (remove old map versions) or
        grow persistence.size.
      priority: 3
      thresholds:
        critical: 90
        warning: 80
      options:
        notifyNoData: false
        evaluationDelay: 60
